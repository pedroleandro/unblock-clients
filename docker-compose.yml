services:
  app:
    build:
      context: .
    environment:
      - TZ=America/Sao_Paulo
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SERVICE_NAME=${DB_SERVICE_NAME}
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "main.py"]
